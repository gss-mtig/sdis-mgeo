<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unidades administrativas de España — teselas vectoriales del IGN</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.css">
  <style>
    html, body, #mapa { width: 100%; height: 100%; margin: 0; }
    #estado { position: absolute; z-index: 1; top: .75rem; left: .75rem; max-width: 24rem; padding: .65rem .8rem; background: #fff; font: 14px/1.4 system-ui, sans-serif; box-shadow: 0 1px 5px #0003; }
  </style>
</head>
<body>
  <div id="estado">Teselas vectoriales de unidades administrativas del IGN.</div>
  <div id="mapa" aria-label="Unidades administrativas de España"></div>
  <script type="module">
    import * as maplibregl from "https://unpkg.com/maplibre-gl@6.18.0/dist/maplibre-gl.mjs";

    const mapa = new maplibregl.Map({
      container: "mapa",
      style: "https://vt-unidades-administrativas.ign.es/demo/style_s3_cloud.json",
      center: [-3.7, 40.2],
      zoom: 5
    });

    mapa.addControl(new maplibregl.NavigationControl(), "top-right");
    mapa.on("error", (evento) => {
      if (evento.error) console.error("Error al cargar el estilo o las teselas del IGN:", evento.error);
    });
  </script>
</body>
</html>
